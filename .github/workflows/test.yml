name: Self-test

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  coredns:
    name: coredns (${{ matrix.version }}${{ matrix.extra_args && format(' {0}', matrix.extra_args) || '' }}${{ matrix.expected_results && ' expected_results' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: latest
            extra_args: ""
            expect_exit: "0"
          - version: v2.0.0
            extra_args: ""
            expect_exit: "0"
          # --strict stops at the first failed test: exercises the exit-1 path
          - version: latest
            extra_args: --strict
            expect_exit: "1"
          # expected_results through the whole action: CoreDNS passes, so a test
          # listed as failing is an improvement, and on_regression: fail has no
          # regression to fail on.
          - version: latest
            extra_args: ""
            expect_exit: "0"
            expected_results: .github/fixtures/expected/coredns.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch example CNF
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lfn-cnti/testsuite
          path: testsuite
          sparse-checkout: example-cnfs/coredns
      - name: Run action
        id: cnti
        uses: ./
        with:
          version: ${{ matrix.version }}
          cnf_config: testsuite/example-cnfs/coredns/cnti-testsuite.yaml
          extra_args: ${{ matrix.extra_args }}
          log_level: info
          fail_on_failure: false
          expected_results: ${{ matrix.expected_results || '' }}
          on_regression: fail
      - name: Check outputs
        run: |
          echo "status=${{ steps.cnti.outputs.status }} exit=${{ steps.cnti.outputs.exit_code }}"
          echo "essential ${{ steps.cnti.outputs.essential_passed }}/${{ steps.cnti.outputs.essential_max_passed }}"
          test -n "${{ steps.cnti.outputs.results_file }}"
          test "${{ steps.cnti.outputs.exit_code }}" = "${{ matrix.expect_exit }}"
          test -n "${{ steps.cnti.outputs.maximum_points }}"
          if [[ -n "${{ matrix.expected_results }}" ]]; then
            test "${{ steps.cnti.outputs.improvements }}" = "liveness"
            test -z "${{ steps.cnti.outputs.regressions }}"
          fi

  # The comparison with expected_results (#11), on a results file and an
  # expectations file of every kind of difference, and on the files it must not
  # accept.
  expected-results:
    name: expected results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the comparison
        run: |
          set -euo pipefail
          f=.github/fixtures/expected
          t=$(mktemp -d)
          compare() { # expected-file label
            : > "$t/$2.out"; : > "$t/$2.md"
            GITHUB_OUTPUT="$t/$2.out" GITHUB_STEP_SUMMARY="$t/$2.md" RESULTS_FILE=$f/results.yml EXPECTED_RESULTS=$1 \
              bash scripts/compare_expected.sh | tee "$t/$2.log"
          }
          compare $f/expected.yaml main
          cat "$t/main.out" "$t/main.md"
          grep -qx 'regressions=liveness' "$t/main.out"
          grep -qx 'improvements=hostpath_mounts' "$t/main.out"
          grep -qx 'changed=hostpath_mounts,liveness,node_drain' "$t/main.out"
          grep -qF '| `hostpath_mounts` | failed | **passed** | improvement: remove its entry; listed because: /sys/fs/bpf from the node is required by the non-root design |' "$t/main.md"
          grep -qF '| `liveness` | passed | **failed** | regression |' "$t/main.md"
          grep -qF '| `node_drain` | skipped | **na** | changed |' "$t/main.md"
          grep -q '3 of the 5 tests differ from the file: 1 regression(s), 1 improvement(s)' "$t/main.md"
          grep -q "::warning::liveness: expected passed, now failed (regression)" "$t/main.log"
          grep -q "::warning::expected_results lists not_run without a status of a results file .*it has 'broken'.*: not_run is not compared" "$t/main.log"
          if grep -q zombie_handled "$t/main.out"; then echo "::error::a test failing as listed is a change"; exit 1; fi

          printf -- '- test: hostpath_mounts\n  status: passed\n- {test: zombie_handled, status: failed}\n- {test: liveness, status: failed}\n- {test: node_drain, status: na}\n' > "$t/same.yaml"
          compare "$t/same.yaml" same
          grep -q "Every one of the 5 tests has the result the file expects" "$t/same.md"
          grep -qx 'changed=' "$t/same.out"

          # A misspelled key leaves the test known but its status unknown: it is
          # not compared, so its known failure is no regression. An entry
          # without a test is ignored. A | in a reason stays in its cell.
          printf -- '- {test: zombie_handled, stauts: failed}\n- {status: failed, reason: no test}\n- {test: liveness, status: failed}\n- {test: node_drain, status: failed, reason: "kubectl get pods | grep coredns"}\n' > "$t/typo.yaml"
          compare "$t/typo.yaml" typo
          grep -q "lists zombie_handled without a status of a results file .*: zombie_handled is not compared" "$t/typo.log"
          grep -q "has an entry without a test: it is ignored" "$t/typo.log"
          if grep -q zombie_handled "$t/typo.out"; then echo "::error::an entry without a status made a change"; exit 1; fi
          grep -qx 'regressions=' "$t/typo.out"
          grep -qx 'changed=node_drain' "$t/typo.out"
          grep -qF '| `node_drain` | failed | **na** | changed; listed because: kubectl get pods \| grep coredns |' "$t/typo.md"

          echo 'not: a list' > "$t/bad.yaml"
          compare "$t/bad.yaml" bad
          grep -q "is not a list of {test, status, reason}: the results are not compared" "$t/bad.log"
          grep -qx 'regressions=' "$t/bad.out"
          test ! -s "$t/bad.md"

          compare "$t/missing.yaml" missing
          grep -q "is not a file: the results are not compared" "$t/missing.log"

          compare "" none
          grep -qx 'changed=' "$t/none.out"
          test ! -s "$t/none.md"

  # The suite with `analyze` (lfn-cnti/testsuite#2873), built once for the two
  # analysis jobs below until a release has it; then they use the release.
  suite-with-analyze:
    name: suite with analyze (until a release has it)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lfn-cnti/testsuite
          ref: feat/analyze
          path: testsuite-src
          fetch-depth: 0
          persist-credentials: false
      - name: Build
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/testsuite-src:/workspace" -w /workspace crystallang/crystal:1.19.1-alpine-build sh -c "\
            git config --global --add safe.directory /workspace && shards install && \
            crystal build src/cnti-testsuite.cr --static --link-flags '-lxml2 -llzma'"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cnti-testsuite-analyze
          path: testsuite-src/cnti-testsuite
          retention-days: 1

  # The wrapper against a stand-in for the model's API, with the suite doing
  # its part for real: what reaches the endpoint, the key's only way there,
  # the retry without response_format, a run with nothing to send, and every
  # way it can go wrong ending as a warning. No real model or key.
  analyze:
    name: analyze (mock model)
    needs: suite-with-analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cnti-testsuite-analyze
          path: ${{ runner.temp }}/suite
      - name: Check the analysis
        env:
          KEY: sk-test-not-a-real-key-0123456789
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/suite/cnti-testsuite"; export PATH="$RUNNER_TEMP/suite:$PATH"
          f=.github/fixtures/analyze
          results=$f/run/cnti-testsuite-results-20261031-120000-000.yml
          state=$(mktemp -d)
          python3 "$f/mock_model.py" "$state" &
          for _ in $(seq 20); do curl -s -o /dev/null http://127.0.0.1:8765/ && break || sleep 0.5; done
          reply() { jq -n --argjson s "$1" --argjson b "$2" '{status: $s, body: $b}' > "$state/reply.json"; }
          requests() { ls "$state"/request-*.json 2>/dev/null | wc -l; }
          last() { ls -1 "$state"/request-*.json | sort -V | tail -1; }
          # The ::add-mask:: command is the one line the runner reads and never
          # shows; anything else with the key is a leak.
          no_key() { if grep -v '^::add-mask::' "$1" | grep -q "$KEY"; then echo "::error::the key is in $1"; exit 1; fi; }
          run() { # label, then env assignments
            local label=$1; shift
            rm -rf cnti; : > "$state/$label.out"; : > "$state/$label.md"
            env GITHUB_OUTPUT="$state/$label.out" GITHUB_STEP_SUMMARY="$state/$label.md" RESULTS_FILE=$results \
              ANALYZE_ENDPOINT=http://127.0.0.1:8765 ANALYZE_MODEL=mock-model "$@" bash scripts/analyze.sh > "$state/$label.log" 2>&1
            cat "$state/$label.log"
            no_key "$state/$label.log"; no_key "$state/$label.md"
          }
          answer=$(cat "$f/answer.json")

          echo "::group::anthropic: the request the suite prepared, and the key in its header only"
          reply 200 "$(jq -n --arg t "$answer" '{model: "mock-claude", stop_reason: "end_turn", content: [{type: "text", text: $t}]}')"
          run anthropic ANALYZE_PROVIDER=anthropic ANALYZE_API_KEY=$KEY
          req=$(last)
          jq -e '.path == "/v1/messages"' "$req"
          jq -e '.headers["x-api-key"] == "'"$KEY"'" and (.headers["anthropic-version"] | length > 0)' "$req"
          jq -e '.body | fromjson | .output_config.format.type == "json_schema" and (.messages[0].content | contains("\"id\":\"T1-C1\""))' "$req"
          grep -q '^### AI analysis (advisory, generated by `mock-claude`' "$state/anthropic.md"
          grep -qF "scheduling_failed Pod/db-0 in cnf: 0/3 nodes are available: 2 node(s) didn't match PersistentVolume's node affinity (T1-C1)" "$state/anthropic.md"
          grep -q "1 cited fact(s) not in the facts left out" "$state/anthropic.md"
          grep -qx 'file=cnti/analysis.md' "$state/anthropic.out"
          echo "::endgroup::"

          echo "::group::openai-compatible: no key, and the request again without response_format after a 400"
          ok=$(jq -n --arg c "$answer" '{model: "m", choices: [{message: {content: $c}}]}')
          jq -n --argjson ok "$ok" '{status: 400, body: {error: {message: "Unrecognized request argument supplied: response_format"}}, then: {status: 200, body: $ok}}' > "$state/reply.json"
          before=$(requests)
          run retry ANALYZE_PROVIDER=openai-compatible ANALYZE_API_KEY=
          test "$(requests)" = "$((before + 2))"
          grep -q "sending request.retry.json" "$state/retry.log"
          jq -e '(.headers | has("Authorization") | not) and (.body | fromjson | has("response_format") | not) and .path == "/chat/completions"' "$(last)"
          grep -q '^\*\*zombie_handled\*\*, failed' "$state/retry.md"
          echo "::endgroup::"

          echo "::group::every failure expected: nothing sent, the reasons in the summary"
          printf -- '- {test: node_drain, status: failed, reason: node-local storage on kind}\n- {test: zombie_handled, status: failed, reason: no init in the image}\n' > "$state/expected.yaml"
          before=$(requests)
          run expected ANALYZE_PROVIDER=anthropic ANALYZE_API_KEY=$KEY EXPECTED_RESULTS="$state/expected.yaml"
          test "$(requests)" = "$before"
          grep -q '^- \*\*node_drain\*\*, failed: node-local storage on kind$' "$state/expected.md"
          if grep -q '^### AI analysis' "$state/expected.md"; then echo "::error::an expected failure was analyzed"; exit 1; fi
          echo "::endgroup::"

          echo "::group::failures are warnings"
          reply 400 '{"type": "error", "error": {"type": "invalid_request_error", "message": "model: nope"}}'
          run error ANALYZE_PROVIDER=anthropic ANALYZE_API_KEY=$KEY
          grep -q '::warning::AI analysis skipped: the endpoint answered HTTP 400: model: nope' "$state/error.log"
          test ! -s "$state/error.out"
          run nokey ANALYZE_PROVIDER=anthropic ANALYZE_API_KEY=
          grep -q '::warning::AI analysis skipped: analyze_api_key is not set' "$state/nokey.log"
          run refused ANALYZE_PROVIDER=github-models ANALYZE_API_KEY=$KEY
          grep -q '::warning::AI analysis skipped: cnti-testsuite analyze prepare refused: .*no provider' "$state/refused.log"
          mkdir -p "$state/old"; printf '#!/bin/sh\necho "Unknown task"; exit 64\n' > "$state/old/cnti-testsuite"; chmod +x "$state/old/cnti-testsuite"
          PATH="$state/old:$PATH" run old ANALYZE_PROVIDER=anthropic ANALYZE_API_KEY=$KEY
          grep -q "::warning::AI analysis skipped: this cnti-testsuite has no 'analyze'" "$state/old.log"
          echo "::endgroup::"

  # The analysis against a real model, free: a small one in Ollama on the
  # runner, through openai-compatible, as an adopter whose data must stay in
  # their network would run it. A model this small does not always keep to
  # the schema, so a well-formed analysis and the warning for an answer that is
  # not the expected JSON both pass; an unreachable server or an error does not.
  analyze-local-model:
    name: analyze (local model)
    needs: suite-with-analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODEL: qwen2.5:1.5b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cnti-testsuite-analyze
          path: ${{ runner.temp }}/suite
      - name: Start Ollama with a small model
        run: |
          set -euo pipefail
          docker run -d --name ollama -p 127.0.0.1:11434:11434 ollama/ollama:0.40.12@sha256:20d1bbfbabe1c97ba4b16301f08a20d8484bcf77047742a3cb71c613d8e12d0b
          for _ in $(seq 60); do curl -sf http://127.0.0.1:11434/api/version && break || sleep 2; done
          docker exec ollama ollama pull "$MODEL"
      - name: Analyze the fixture's failures
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/suite/cnti-testsuite"; export PATH="$RUNNER_TEMP/suite:$PATH"
          start=$(date +%s)
          GITHUB_OUTPUT="$RUNNER_TEMP/out" RESULTS_FILE=.github/fixtures/analyze/run/cnti-testsuite-results-20261031-120000-000.yml \
            ANALYZE_PROVIDER=openai-compatible ANALYZE_ENDPOINT=http://127.0.0.1:11434/v1 ANALYZE_MODEL="$MODEL" ANALYZE_API_KEY= \
            bash scripts/analyze.sh | tee "$RUNNER_TEMP/analyze.log"
          echo "Answered in $(( $(date +%s) - start )) s"
          if [[ -s cnti/analysis.md ]] && grep -q '^### AI analysis (advisory, generated by' cnti/analysis.md; then
            echo "A well-formed analysis"
          elif grep -q "not the expected JSON" "$RUNNER_TEMP/analyze.log"; then
            echo "The model's answer did not keep to the schema: handled as a warning" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::the local model's server did not answer as expected"
            exit 1
          fi
      - name: Ollama's log
        if: failure()
        run: docker logs ollama 2>&1 | tail -50

  # A suite without `cnti-testsuite evidence` (before v2.3.0) and a run that asks
  # for the badge: the action must fail, not skip the badge quietly.
  old-suite-badge:
    name: old suite with badge_branch (fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch example CNF
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lfn-cnti/testsuite
          path: testsuite
          sparse-checkout: example-cnfs/coredns
      - name: Run action
        id: cnti
        continue-on-error: true
        uses: ./
        with:
          version: v2.2.0
          cnf_config: testsuite/example-cnfs/coredns/cnti-testsuite.yaml
          badge_branch: badges-selftest-old-suite
          fail_on_failure: false
      - name: The run must have failed on the missing evidence subcommand
        run: |
          echo "outcome=${{ steps.cnti.outcome }}"
          test "${{ steps.cnti.outcome }}" = "failure"

  # The evidence bundle pushed to a repository: this one, on the evidence-selftest
  # branch, with the job's own token; the same clone, commit and push path as an
  # external evidence repository. Not on pull requests, whose token cannot write.
  evidence:
    name: evidence (coredns)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch example CNF
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lfn-cnti/testsuite
          path: testsuite
          sparse-checkout: example-cnfs/coredns
      - name: Run action
        id: cnti
        uses: ./
        with:
          cnf_config: testsuite/example-cnfs/coredns/cnti-testsuite.yaml
          log_level: info
          fail_on_failure: false
          evidence_repository: ${{ github.repository }}
          evidence_token: ${{ github.token }}
          evidence_branch: evidence-selftest
          attest: "true"
      - name: Verify the attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify cnti/evidence/cnti-testsuite-results-*.yml --repo "${GITHUB_REPOSITORY}" --predicate-type https://in-toto.io/attestation/test-result/v0.1 --format json \
            | jq -S '.[0].verificationResult.statement.predicate' > signed.json
          jq -e '.predicate.cnti.provenance.method == "github-attestation"' cnti/evidence/cnti-evidence.json
          # The signed predicate is the bundle's: nothing changes the statement after signing.
          jq -S '.predicate' cnti/evidence/cnti-evidence.json | diff - signed.json
      - name: Check the published bundle
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: evidence-selftest
        run: |
          set -euo pipefail
          # No trailing slash for the directory itself: the contents API answers it with 404.
          get() { gh api "repos/$REPO/contents/cnti/coredns${1:+/$1}?ref=$REF" "${@:2}"; }
          for f in latest/cnti-badge.svg latest/cnti-badge.json; do
            get "$f" --jq .name
          done
          run_dir=$(get "" --jq '[.[]|select(.type=="dir" and .name!="latest")|.name]|sort|last')
          for f in cnti-badge.svg cnti-badge.json cnti-evidence.json config/cnti-testsuite.yaml; do
            get "$run_dir/$f" --jq .name
          done
          get "$run_dir/cnti-evidence.json" --jq .content | base64 -d > published.json
          jq -e '.predicate.configuration | length >= 1' published.json
          jq -e '.predicate.cnti.run_url | endswith("/actions/runs/${{ github.run_id }}")' published.json
          # The statement is completed before it is signed or published: the
          # published one is the bundle's, byte for byte.
          cmp published.json cnti/evidence/cnti-evidence.json

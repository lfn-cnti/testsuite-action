name: Self-test

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  coredns:
    name: coredns (${{ matrix.version }}${{ matrix.extra_args && format(' {0}', matrix.extra_args) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: latest
            extra_args: ""
            expect_exit: "0"
          - version: v2.0.0
            extra_args: ""
            expect_exit: "0"
          # --strict stops at the first failed test: exercises the exit-1 path
          - version: latest
            extra_args: --strict
            expect_exit: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch example CNF
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lfn-cnti/testsuite
          path: testsuite
          sparse-checkout: example-cnfs/coredns
      - name: Run action
        id: cnti
        uses: ./
        with:
          version: ${{ matrix.version }}
          cnf_config: testsuite/example-cnfs/coredns/cnti-testsuite.yaml
          extra_args: ${{ matrix.extra_args }}
          log_level: info
          fail_on_failure: false
      - name: Check outputs
        run: |
          echo "status=${{ steps.cnti.outputs.status }} exit=${{ steps.cnti.outputs.exit_code }}"
          echo "essential ${{ steps.cnti.outputs.essential_passed }}/${{ steps.cnti.outputs.essential_max_passed }}"
          test -n "${{ steps.cnti.outputs.results_file }}"
          test "${{ steps.cnti.outputs.exit_code }}" = "${{ matrix.expect_exit }}"
          test -n "${{ steps.cnti.outputs.maximum_points }}"

  # A StatefulSet with a PersistentVolumeClaim, drained: with the shared storage
  # (the default, and added to a kind_config of the adopter's) its volume has no
  # node affinity and node_drain moves it; without, kind's volume is pinned to
  # its node.
  shared-storage:
    name: shared storage (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            shared: "true"
            custom_config: false
          - name: kind_config
            shared: "true"
            custom_config: true
          - name: off
            shared: "false"
            custom_config: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch sample CNF
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lfn-cnti/testsuite
          path: testsuite
          sparse-checkout: sample-cnfs/sample-elastic-vct
      - name: Write a kind config of the adopter's
        if: matrix.custom_config
        run: |
          cat > kind-adopter.yaml <<'KIND'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
            - role: worker
              labels:
                example: adopter
            - role: worker
          KIND
      - name: Run action
        id: cnti
        uses: ./
        with:
          cnf_config: testsuite/sample-cnfs/sample-elastic-vct/cnti-testsuite.yaml
          tests: node_drain
          kind_shared_storage: ${{ matrix.shared }}
          kind_config: ${{ matrix.custom_config && 'kind-adopter.yaml' || '' }}
          upload_results: false
          fail_on_failure: false
      - name: Check the volume and the drain
        env:
          SHARED: ${{ matrix.shared }}
          CUSTOM_CONFIG: ${{ matrix.custom_config }}
          RESULTS_FILE: ${{ steps.cnti.outputs.results_file }}
        run: |
          set -euo pipefail
          kubectl get pv -o custom-columns='PV:.metadata.name,CLAIM:.spec.claimRef.name,AFFINITY:.spec.nodeAffinity'
          total=$(kubectl get pv -o json | jq '.items | length')
          pinned=$(kubectl get pv -o json | jq '[.items[] | select(.spec.nodeAffinity != null)] | length')
          drain=$(yq '.items[] | select(.name == "node_drain") | .status' "$RESULTS_FILE")
          echo "volumes=$total pinned=$pinned node_drain=$drain"
          test "$total" -ge 1
          if [[ "$SHARED" == "true" ]]; then
            test "$pinned" = "0"
            test "$drain" = "passed"
          else
            test "$pinned" = "$total"
          fi
          # The adopter's config is the one the cluster was made from.
          if [[ "$CUSTOM_CONFIG" == "true" ]]; then
            test "$(kubectl get nodes -l example=adopter -o name | wc -l)" = "1"
          fi

  # A suite without `cnti-testsuite evidence` (before v2.3.0) and a run that asks
  # for the badge: the action must fail, not skip the badge quietly.
  old-suite-badge:
    name: old suite with badge_branch (fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch example CNF
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lfn-cnti/testsuite
          path: testsuite
          sparse-checkout: example-cnfs/coredns
      - name: Run action
        id: cnti
        continue-on-error: true
        uses: ./
        with:
          version: v2.2.0
          cnf_config: testsuite/example-cnfs/coredns/cnti-testsuite.yaml
          badge_branch: badges-selftest-old-suite
          fail_on_failure: false
      - name: The run must have failed on the missing evidence subcommand
        run: |
          echo "outcome=${{ steps.cnti.outcome }}"
          test "${{ steps.cnti.outcome }}" = "failure"

  # The evidence bundle pushed to a repository: this one, on the evidence-selftest
  # branch, with the job's own token; the same clone, commit and push path as an
  # external evidence repository. Not on pull requests, whose token cannot write.
  evidence:
    name: evidence (coredns)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch example CNF
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lfn-cnti/testsuite
          path: testsuite
          sparse-checkout: example-cnfs/coredns
      - name: Run action
        id: cnti
        uses: ./
        with:
          cnf_config: testsuite/example-cnfs/coredns/cnti-testsuite.yaml
          log_level: info
          fail_on_failure: false
          evidence_repository: ${{ github.repository }}
          evidence_token: ${{ github.token }}
          evidence_branch: evidence-selftest
          attest: "true"
      - name: Verify the attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify cnti/evidence/cnti-testsuite-results-*.yml --repo "${GITHUB_REPOSITORY}" --predicate-type https://in-toto.io/attestation/test-result/v0.1 --format json \
            | jq -S '.[0].verificationResult.statement.predicate' > signed.json
          jq -e '.predicate.cnti.provenance.method == "github-attestation"' cnti/evidence/cnti-evidence.json
          # The signed predicate is the bundle's: nothing changes the statement after signing.
          jq -S '.predicate' cnti/evidence/cnti-evidence.json | diff - signed.json
      - name: Check the published bundle
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: evidence-selftest
        run: |
          set -euo pipefail
          # No trailing slash for the directory itself: the contents API answers it with 404.
          get() { gh api "repos/$REPO/contents/cnti/coredns${1:+/$1}?ref=$REF" "${@:2}"; }
          for f in latest/cnti-badge.svg latest/cnti-badge.json; do
            get "$f" --jq .name
          done
          run_dir=$(get "" --jq '[.[]|select(.type=="dir" and .name!="latest")|.name]|sort|last')
          for f in cnti-badge.svg cnti-badge.json cnti-evidence.json config/cnti-testsuite.yaml; do
            get "$run_dir/$f" --jq .name
          done
          get "$run_dir/cnti-evidence.json" --jq .content | base64 -d > published.json
          jq -e '.predicate.configuration | length >= 1' published.json
          jq -e '.predicate.cnti.run_url | endswith("/actions/runs/${{ github.run_id }}")' published.json
          # The statement is completed before it is signed or published: the
          # published one is the bundle's, byte for byte.
          cmp published.json cnti/evidence/cnti-evidence.json

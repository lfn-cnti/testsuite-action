name: Self-test

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  coredns:
    name: coredns (${{ matrix.version }}${{ matrix.extra_args && format(' {0}', matrix.extra_args) || '' }}${{ matrix.expected_results && ' expected_results' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each job's artifacts under their own names (artifact_name, and the
          # evidence artifact named after it).
          - version: latest
            extra_args: ""
            expect_exit: "0"
            artifact: coredns-latest
          - version: v2.0.0
            extra_args: ""
            expect_exit: "0"
            artifact: coredns-v2.0.0
          # --strict stops at the first failed test: exercises the exit-1 path
          - version: latest
            extra_args: --strict
            expect_exit: "1"
            artifact: coredns-latest-strict
          # expected_results through the whole action: CoreDNS passes, so a test
          # listed as failing is an improvement, and on_regression: fail has no
          # regression to fail on.
          - version: v2.4.1
            extra_args: ""
            expect_exit: "0"
            expected_results: .github/fixtures/expected/coredns.yaml
            artifact: coredns-expected
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch example CNF
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lfn-cnti/testsuite
          path: testsuite
          sparse-checkout: example-cnfs/coredns
      - name: Run action
        id: cnti
        uses: ./
        with:
          version: ${{ matrix.version }}
          cnf_config: testsuite/example-cnfs/coredns/cnti-testsuite.yaml
          extra_args: ${{ matrix.extra_args }}
          log_level: info
          fail_on_failure: false
          expected_results: ${{ matrix.expected_results || '' }}
          on_regression: fail
          artifact_name: ${{ matrix.artifact }}
          # On pull requests, where nothing is published, the expected_results
          # job bundles two hidden extra files: one allowed, one withheld.
          evidence_repository: ${{ matrix.expected_results && github.event_name == 'pull_request' && github.repository || '' }}
          evidence_files: |
            .github/fixtures/expected/coredns.yaml
            .github/fixtures/expected/.credential-sample.txt
      - name: Check outputs
        run: |
          echo "status=${{ steps.cnti.outputs.status }} exit=${{ steps.cnti.outputs.exit_code }}"
          echo "essential ${{ steps.cnti.outputs.essential_passed }}/${{ steps.cnti.outputs.essential_max_passed }}"
          test -n "${{ steps.cnti.outputs.results_file }}"
          test "${{ steps.cnti.outputs.exit_code }}" = "${{ matrix.expect_exit }}"
          test -n "${{ steps.cnti.outputs.maximum_points }}"
          if [[ -n "${{ matrix.expected_results }}" ]]; then
            test "${{ steps.cnti.outputs.improvements }}" = "liveness"
            test -z "${{ steps.cnti.outputs.regressions }}"
          fi
      # The evidence alone, named after artifact_name: the bundle, without the
      # run's logs and diagnostics.
      - name: Download the evidence artifact
        if: matrix.expected_results
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: coredns-expected-evidence
          path: ${{ runner.temp }}/evidence
      - name: Check the evidence artifact
        if: matrix.expected_results
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/evidence"
          find . -type f | sort
          test -f cnti-evidence.json
          test -f cnti-badge.svg
          test -f cnti-badge.json
          # Exactly one results file and one JUnit report.
          shopt -s nullglob
          results=(cnti-testsuite-results-*.yml)
          junit=(cnti-testsuite-results-*.xml)
          test "${#results[@]}" -eq 1
          test "${#junit[@]}" -eq 1
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            # The allowed hidden file is in the artifact, the withheld one not.
            cmp .github/fixtures/expected/coredns.yaml "$GITHUB_WORKSPACE/.github/fixtures/expected/coredns.yaml"
            test ! -e .github/fixtures/expected/.credential-sample.txt
            jq -e '.predicate.cnti.published_files == [".github/fixtures/expected/coredns.yaml"] and .predicate.cnti.withheld_files == [".github/fixtures/expected/.credential-sample.txt"]' cnti-evidence.json
          fi
          if find . -name '*.log' -o -name diagnostics | grep -q .; then echo "::error::logs or diagnostics in the evidence artifact"; exit 1; fi

  # The extra files of a published bundle: copied with their paths (a hidden
  # one too), an excluded one withheld, and none that would replace the
  # bundle's own files or point outside the bundle.
  complete-statement:
    name: complete statement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the extra files
        run: |
          set -euo pipefail
          d=$(mktemp -d)/bundle; mkdir -p "$d"
          echo '{"predicate": {"cnti": {"status": "passed"}}}' > "$d/cnti-evidence.json"
          echo '<svg/>' > "$d/cnti-badge.svg"
          echo '[]' > cnti-evidence.json
          mkdir -p cnti-badge.svg && echo extra > cnti-badge.svg/extra
          echo 'token: s3cret' > my-secret.txt
          ln -s /etc/hostname link-out.txt
          ln -s .github/dependabot.yml link-in.yml
          : > out1.txt
          GITHUB_OUTPUT=out1.txt EVIDENCE_DIR="$d" EVIDENCE_REPOSITORY=org/evidence EVIDENCE_EXCLUDE='*secret*' GITHUB_REPOSITORY=org/cnf GITHUB_RUN_ID=1 \
            EVIDENCE_FILES=$'.github/dependabot.yml\ncnti-evidence.json\n../etc/passwd\n/etc/hostname\nmy-secret.txt\nmissing.yaml\ncnti-badge.svg/extra\nlink-out.txt\nlink-in.yml' \
            bash scripts/complete_statement.sh | tee log.txt
          jq . "$d/cnti-evidence.json"
          jq -e '.predicate.cnti.status == "passed"' "$d/cnti-evidence.json"
          jq -e '.predicate.cnti.published_files == [".github/dependabot.yml", "link-in.yml"]' "$d/cnti-evidence.json"
          jq -e '.predicate.cnti.withheld_files == ["my-secret.txt"]' "$d/cnti-evidence.json"
          cmp .github/dependabot.yml "$d/.github/dependabot.yml"
          test ! -e "$d/my-secret.txt"
          test ! -e "$(dirname "$d")/etc/passwd"
          grep -q "'cnti-evidence.json' would replace the bundle's own cnti-evidence.json, skipped" log.txt
          grep -q "'../etc/passwd' is outside the workspace, skipped" log.txt
          grep -q "'/etc/hostname' is outside the workspace, skipped" log.txt
          grep -q "'missing.yaml' not found, skipped" log.txt
          grep -q "'cnti-badge.svg/extra' could not be copied into the bundle, skipped" log.txt
          test "$(cat "$d/cnti-badge.svg")" = '<svg/>'
          grep -q "'link-out.txt' leads outside the workspace (/etc/hostname), skipped" log.txt
          test ! -e "$d/link-out.txt"
          cmp .github/dependabot.yml "$d/link-in.yml"
          grep -q "Statement completed: .*, 2 extra file(s) in the bundle, 1 withheld" log.txt
          grep -qx 'completed=true' out1.txt
          # A statement that is not JSON: a warning, and the file as it was.
          echo 'not json' > "$d/cnti-evidence.json"
          : > out2.txt
          GITHUB_OUTPUT=out2.txt EVIDENCE_DIR="$d" GITHUB_REPOSITORY=org/cnf GITHUB_RUN_ID=1 bash scripts/complete_statement.sh | tee log2.txt
          grep -q "the statement could not be completed; it is neither signed, uploaded on its own nor published" log2.txt
          test ! -s out2.txt
          test "$(cat "$d/cnti-evidence.json")" = "not json"
          test ! -e "$d/cnti-evidence.json.tmp"

  # The results and the evidence artifact under one name, or the results under
  # none: refused before the run, rather than failing an upload after it.
  default-branch:
    name: default branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check how the default branch is decided
        # No token: the API cases ask a local stand-in.
        run: |
          set -euo pipefail
          db() { : > out.txt; env -u PAYLOAD_DEFAULT_BRANCH GITHUB_OUTPUT=out.txt "$@" bash scripts/default_branch.sh | tee log.txt; cat out.txt; }
          # The payload names it.
          db EVENT=push PAYLOAD_DEFAULT_BRANCH=main GITHUB_REF=refs/heads/main GITHUB_REF_NAME=main
          grep -qx 'on_default=true' out.txt; grep -qx 'default_branch=main' out.txt; grep -q 'from the event' log.txt
          db EVENT=pull_request PAYLOAD_DEFAULT_BRANCH=main GITHUB_REF=refs/pull/36/merge GITHUB_REF_NAME=36/merge
          grep -qx 'on_default=false' out.txt
          # Not a tag named like it, nor pull_request_target, whose ref is the base branch.
          db EVENT=push PAYLOAD_DEFAULT_BRANCH=main GITHUB_REF=refs/tags/main GITHUB_REF_NAME=main
          grep -qx 'on_default=false' out.txt
          db EVENT=pull_request_target PAYLOAD_DEFAULT_BRANCH=main GITHUB_REF=refs/heads/main GITHUB_REF_NAME=main
          grep -qx 'on_default=false' out.txt
          # A schedule event's payload has no repository: the run is on the default branch.
          db EVENT=schedule GITHUB_REF=refs/heads/main GITHUB_REF_NAME=main GITHUB_API_URL=http://127.0.0.1:9
          grep -qx 'on_default=true' out.txt; grep -q 'from a scheduled run' log.txt
          # No branch in the payload otherwise: the API, with curl. A local
          # stand-in answers: pretty-printed, compact, and a 404.
          api=$(mktemp -d); mkdir -p "$api/repos/org"
          printf '{\n  "name": "cnf",\n  "default_branch": "trunk",\n  "x": 1\n}\n' > "$api/repos/org/pretty"
          printf '{"name":"cnf","default_branch":"trunk"}' > "$api/repos/org/compact"
          (cd "$api" && exec python3 -m http.server 8765 --bind 127.0.0.1) > /dev/null 2>&1 &
          for _ in $(seq 20); do curl -sf -o /dev/null http://127.0.0.1:8765/repos/org/compact && break; sleep 0.5; done
          stub="GITHUB_API_URL=http://127.0.0.1:8765"
          db EVENT=workflow_dispatch GITHUB_REF=refs/heads/trunk GITHUB_REF_NAME=trunk GITHUB_REPOSITORY=org/pretty $stub
          grep -qx 'on_default=true' out.txt; grep -qx 'default_branch=trunk' out.txt; grep -q 'from the API' log.txt
          db EVENT=workflow_dispatch GITHUB_REF=refs/heads/trunk GITHUB_REF_NAME=trunk GITHUB_REPOSITORY=org/compact $stub
          grep -qx 'on_default=true' out.txt
          db EVENT=workflow_dispatch GITHUB_REF=refs/heads/feature GITHUB_REF_NAME=feature GITHUB_REPOSITORY=org/compact $stub
          grep -qx 'on_default=false' out.txt; grep -qx 'default_branch=trunk' out.txt
          # Unknown: nothing is published, with a warning. A 404, and no answer.
          db EVENT=workflow_dispatch GITHUB_REF=refs/heads/trunk GITHUB_REF_NAME=trunk GITHUB_REPOSITORY=org/missing $stub
          grep -qx 'on_default=false' out.txt; grep -q '::warning::The default branch is unknown' log.txt
          db EVENT=workflow_dispatch GITHUB_REF=refs/heads/trunk GITHUB_REF_NAME=trunk GITHUB_REPOSITORY=org/compact GITHUB_API_URL=http://127.0.0.1:9
          grep -qx 'on_default=false' out.txt; grep -q '::warning::The default branch is unknown' log.txt
          # Nothing asks gh: a self-hosted runner may have none.
          if grep -n 'gh api' scripts/*.sh; then echo "::error::a script still calls gh api"; exit 1; fi
          # The publishers follow the step.
          d=$(mktemp -d); echo '<svg/>' > "$d/cnti-badge.svg"; echo '{"label":"CNTi essential","message":"passed"}' > "$d/cnti-badge.json"
          RUN_EXIT_CODE=0 BADGE_SOURCE_DIR="$d" BADGE_BRANCH=badges GITHUB_REF_NAME=main ON_DEFAULT_BRANCH=false DEFAULT_BRANCH=trunk bash scripts/publish_badge.sh | tee log.txt
          grep -q 'Badge not published: main is not the default branch (trunk)' log.txt

  same-artifact-names:
    name: artifact names (${{ matrix.case }}, fails)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: same
            artifact_name: same
            evidence_artifact_name: same
          - case: empty
            artifact_name: ""
            evidence_artifact_name: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run action
        id: cnti
        continue-on-error: true
        uses: ./
        with:
          helm_chart_dir: .
          artifact_name: ${{ matrix.artifact_name }}
          evidence_artifact_name: ${{ matrix.evidence_artifact_name }}
      - name: The run must have stopped at the names
        env:
          OUTCOME: ${{ steps.cnti.outcome }}
          CONFIG_ERROR: ${{ steps.cnti.outputs.config_error }}
          RESULTS_FILE: ${{ steps.cnti.outputs.results_file }}
        run: |
          test "$OUTCOME" = failure
          # Stopped by the name check, before the suite ran.
          test "$CONFIG_ERROR" = artifact_names
          test -z "$RESULTS_FILE"

  # The wrapper around the suite's comparison, on a results file and an
  # expectations file of every kind of difference, on the files the suite
  # refuses, and with a suite that has no `compare`. What counts as a
  # difference is the suite's, and its specs test it.
  expected-results:
    name: expected results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The current release (`compare` and `analyze` are in v2.4.0 and later).
      - name: The suite (v2.4.1)
        run: |
          mkdir -p "$RUNNER_TEMP/suite"
          curl -sSfL --retry 3 https://github.com/lfn-cnti/testsuite/releases/download/v2.4.1/cnti-testsuite-v2.4.1.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/suite"
      - name: Check the comparison
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/suite:$PATH"
          f=.github/fixtures/expected
          t=$(mktemp -d)
          compare() { # expected-file label
            : > "$t/$2.out"; : > "$t/$2.md"
            GITHUB_OUTPUT="$t/$2.out" GITHUB_STEP_SUMMARY="$t/$2.md" RESULTS_FILE=$f/results.yml EXPECTED_RESULTS=$1 \
              bash scripts/compare_expected.sh | tee "$t/$2.log"
          }
          compare $f/expected.yaml main
          cat "$t/main.out" "$t/main.md"
          grep -qx 'regressions=liveness' "$t/main.out"
          grep -qx 'improvements=hostpath_mounts' "$t/main.out"
          grep -qx 'changed=hostpath_mounts,liveness,node_drain' "$t/main.out"
          grep -qF '| `hostpath_mounts` | failed | **passed** | improvement: remove its entry; listed because: /sys/fs/bpf from the node is required by the non-root design |' "$t/main.md"
          grep -qF '| `liveness` | passed | **failed** | regression |' "$t/main.md"
          grep -q '3 of the 5 compared tests differ from the file: 1 regression(s), 1 improvement(s)' "$t/main.md"
          grep -qx "::warning::liveness: expected passed, now failed (regression)" "$t/main.log"
          grep -qF "::warning::hostpath_mounts: expected failed, now passed (improvement); listed because: /sys/fs/bpf" "$t/main.log"
          grep -q "::warning::.*lists not_run without a status of a results file .*it has 'broken'.*: not_run is not compared" "$t/main.log"
          grep -q "Compared with $f/expected.yaml: 3 change(s), 1 regression(s), 1 improvement(s)" "$t/main.log"
          if grep -q zombie_handled "$t/main.out"; then echo "::error::a test failing as listed is a change"; exit 1; fi

          # An entry without a status leaves its test uncompared, and the
          # suite's warnings reach the job: a reason's | stays in its cell.
          printf -- '- {test: zombie_handled, stauts: failed}\n- {test: liveness, status: failed}\n- {test: node_drain, status: failed, reason: "kubectl get pods | grep coredns"}\n' > "$t/typo.yaml"
          compare "$t/typo.yaml" typo
          grep -q "::warning::.*lists zombie_handled without a status of a results file .*: zombie_handled is not compared" "$t/typo.log"
          grep -qx 'changed=node_drain' "$t/typo.out"
          grep -qx 'regressions=' "$t/typo.out"
          grep -qF '| `node_drain` | failed | **na** | changed; listed because: kubectl get pods \| grep coredns |' "$t/typo.md"

          # Every result as the file expects: no change, and not one warning.
          printf -- '- {test: zombie_handled, status: failed}\n- {test: liveness, status: failed}\n- {test: node_drain, status: na}\n' > "$t/same.yaml"
          compare "$t/same.yaml" same
          grep -qx 'changed=' "$t/same.out"
          if grep -q '::warning::' "$t/same.log"; then echo "::error::a warning without a difference"; exit 1; fi
          grep -q "Compared with $t/same.yaml: 0 change(s), 0 regression(s), 0 improvement(s)" "$t/same.log"

          # What the suite refuses is a warning, and nothing is compared.
          echo 'not: a list' > "$t/bad.yaml"
          compare "$t/bad.yaml" bad
          grep -q "::warning::cnti-testsuite compare refused: .*is not a YAML list of {test, status, reason}.*: the results are not compared" "$t/bad.log"
          grep -qx 'regressions=' "$t/bad.out"
          test ! -s "$t/bad.md"
          compare "$t/missing.yaml" missing
          grep -q "::warning::cnti-testsuite compare refused: .*is not a file.*: the results are not compared" "$t/missing.log"

          compare "" none
          grep -qx 'changed=' "$t/none.out"
          test ! -s "$t/none.md"

          # A released suite without `compare`: a warning, not a failure.
          mkdir "$t/old"
          printf '#!/bin/sh\n[ "$1" = help ] && { echo "Tasks: cert workload evidence"; exit 0; }\nexit 1\n' > "$t/old/cnti-testsuite"
          chmod +x "$t/old/cnti-testsuite"
          PATH="$t/old:$PATH" compare $f/expected.yaml old
          grep -q "::warning::this cnti-testsuite has no 'compare' (it needs v2.4.0 or later): the results are not compared" "$t/old.log"
          grep -qx 'regressions=' "$t/old.out"
          test ! -s "$t/old.md"

  # A StatefulSet with a PersistentVolumeClaim, drained: with the shared storage
  # (the default, and added to a kind_config of the adopter's) its volume has no
  # node affinity and node_drain moves it; without, kind's volume is pinned to
  # its node.
  shared-storage:
    name: shared storage (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            shared: "true"
            custom_config: false
          - name: kind_config
            shared: "true"
            custom_config: true
          - name: off
            shared: "false"
            custom_config: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch sample CNF
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lfn-cnti/testsuite
          path: testsuite
          sparse-checkout: sample-cnfs/sample-elastic-vct
      - name: Write a kind config of the adopter's
        if: matrix.custom_config
        run: |
          cat > kind-adopter.yaml <<'KIND'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
            - role: worker
              labels:
                example: adopter
            - role: worker
          KIND
      - name: Run action
        id: cnti
        uses: ./
        with:
          cnf_config: testsuite/sample-cnfs/sample-elastic-vct/cnti-testsuite.yaml
          tests: node_drain
          kind_shared_storage: ${{ matrix.shared }}
          kind_config: ${{ matrix.custom_config && 'kind-adopter.yaml' || '' }}
          upload_results: false
          fail_on_failure: false
      - name: Check the volume and the drain
        env:
          SHARED: ${{ matrix.shared }}
          CUSTOM_CONFIG: ${{ matrix.custom_config }}
          RESULTS_FILE: ${{ steps.cnti.outputs.results_file }}
        run: |
          set -euo pipefail
          kubectl get pv -o custom-columns='PV:.metadata.name,CLAIM:.spec.claimRef.name,AFFINITY:.spec.nodeAffinity'
          total=$(kubectl get pv -o json | jq '.items | length')
          pinned=$(kubectl get pv -o json | jq '[.items[] | select(.spec.nodeAffinity != null)] | length')
          drain=$(yq '.items[] | select(.name == "node_drain") | .status' "$RESULTS_FILE")
          echo "volumes=$total pinned=$pinned node_drain=$drain"
          test "$total" -ge 1
          if [[ "$SHARED" == "true" ]]; then
            test "$pinned" = "0"
            test "$drain" = "passed"
          else
            test "$pinned" = "$total"
          fi
          # The adopter's config is the one the cluster was made from.
          if [[ "$CUSTOM_CONFIG" == "true" ]]; then
            test "$(kubectl get nodes -l example=adopter -o name | wc -l)" = "1"
          fi

  # The wrapper against a stand-in for the model's API, with the suite doing
  # its part for real: what reaches the endpoint, the key's only way there,
  # the retry without response_format, a run with nothing to send, and every
  # way it can go wrong ending as a warning. No real model or key.
  analyze:
    name: analyze (mock model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The current release (`compare` and `analyze` are in v2.4.0 and later).
      - name: The suite (v2.4.1)
        run: |
          mkdir -p "$RUNNER_TEMP/suite"
          curl -sSfL --retry 3 https://github.com/lfn-cnti/testsuite/releases/download/v2.4.1/cnti-testsuite-v2.4.1.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/suite"
      - name: Check the analysis
        env:
          KEY: sk-test-not-a-real-key-0123456789
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/suite/cnti-testsuite"; export PATH="$RUNNER_TEMP/suite:$PATH"
          f=.github/fixtures/analyze
          results=$f/run/cnti-testsuite-results-20261031-120000-000.yml
          state=$(mktemp -d)
          python3 "$f/mock_model.py" "$state" &
          for _ in $(seq 20); do curl -s -o /dev/null http://127.0.0.1:8765/ && break || sleep 0.5; done
          reply() { jq -n --argjson s "$1" --argjson b "$2" '{status: $s, body: $b}' > "$state/reply.json"; }
          requests() { ls "$state"/request-*.json 2>/dev/null | wc -l; }
          last() { ls -1 "$state"/request-*.json | sort -V | tail -1; }
          # The ::add-mask:: command is the one line the runner reads and never
          # shows; anything else with the key is a leak.
          no_key() { if grep -v '^::add-mask::' "$1" | grep -q "$KEY"; then echo "::error::the key is in $1"; exit 1; fi; }
          run() { # label, then env assignments
            local label=$1; shift
            rm -rf cnti; : > "$state/$label.out"; : > "$state/$label.md"
            env GITHUB_OUTPUT="$state/$label.out" GITHUB_STEP_SUMMARY="$state/$label.md" RESULTS_FILE=$results \
              ANALYZE_ENDPOINT=http://127.0.0.1:8765 ANALYZE_MODEL=mock-model "$@" bash scripts/analyze.sh > "$state/$label.log" 2>&1
            cat "$state/$label.log"
            no_key "$state/$label.log"; no_key "$state/$label.md"
          }
          answer=$(cat "$f/answer.json")

          echo "::group::anthropic: the request the suite prepared, and the key in its header only"
          reply 200 "$(jq -n --arg t "$answer" '{model: "mock-claude", stop_reason: "end_turn", content: [{type: "text", text: $t}]}')"
          run anthropic ANALYZE_PROVIDER=anthropic ANALYZE_API_KEY=$KEY
          req=$(last)
          jq -e '.path == "/v1/messages"' "$req"
          jq -e '.headers["x-api-key"] == "'"$KEY"'" and (.headers["anthropic-version"] | length > 0)' "$req"
          jq -e '.body | fromjson | .output_config.format.type == "json_schema" and (.messages[0].content | contains("\"id\":\"T1-C1\""))' "$req"
          grep -q '^### AI analysis (advisory, generated by `mock-claude`' "$state/anthropic.md"
          grep -qF "scheduling_failed Pod/db-0 in cnf: 0/3 nodes are available: 2 node(s) didn't match PersistentVolume's node affinity (T1-C1)" "$state/anthropic.md"
          grep -q "1 cited fact(s) not in the facts left out" "$state/anthropic.md"
          grep -qx 'file=cnti/analysis.md' "$state/anthropic.out"
          echo "::endgroup::"

          echo "::group::openai-compatible: no key, and the request again without response_format after a 400"
          ok=$(jq -n --arg c "$answer" '{model: "m", choices: [{message: {content: $c}}]}')
          jq -n --argjson ok "$ok" '{status: 400, body: {error: {message: "Unrecognized request argument supplied: response_format"}}, then: {status: 200, body: $ok}}' > "$state/reply.json"
          before=$(requests)
          run retry ANALYZE_PROVIDER=openai-compatible ANALYZE_API_KEY=
          test "$(requests)" = "$((before + 2))"
          grep -q "sending request.retry.json" "$state/retry.log"
          jq -e '(.headers | has("Authorization") | not) and (.body | fromjson | has("response_format") | not) and .path == "/chat/completions"' "$(last)"
          grep -q '^\*\*zombie_handled\*\*, failed' "$state/retry.md"
          echo "::endgroup::"

          echo "::group::every failure expected: nothing sent, the reasons in the summary"
          printf -- '- {test: node_drain, status: failed, reason: node-local storage on kind}\n- {test: zombie_handled, status: failed, reason: no init in the image}\n' > "$state/expected.yaml"
          before=$(requests)
          run expected ANALYZE_PROVIDER=anthropic ANALYZE_API_KEY=$KEY EXPECTED_RESULTS="$state/expected.yaml"
          test "$(requests)" = "$before"
          grep -q '^- \*\*node_drain\*\*, failed: node-local storage on kind$' "$state/expected.md"
          if grep -q '^### AI analysis' "$state/expected.md"; then echo "::error::an expected failure was analyzed"; exit 1; fi
          echo "::endgroup::"

          echo "::group::failures are warnings"
          reply 400 '{"type": "error", "error": {"type": "invalid_request_error", "message": "model: nope"}}'
          run error ANALYZE_PROVIDER=anthropic ANALYZE_API_KEY=$KEY
          grep -q '::warning::AI analysis skipped: the endpoint answered HTTP 400: model: nope' "$state/error.log"
          test ! -s "$state/error.out"
          run nokey ANALYZE_PROVIDER=anthropic ANALYZE_API_KEY=
          grep -q '::warning::AI analysis skipped: analyze_api_key is not set' "$state/nokey.log"
          run refused ANALYZE_PROVIDER=github-models ANALYZE_API_KEY=$KEY
          grep -q '::warning::AI analysis skipped: cnti-testsuite analyze prepare refused: .*no provider' "$state/refused.log"
          mkdir -p "$state/old"; printf '#!/bin/sh\necho "Unknown task"; exit 64\n' > "$state/old/cnti-testsuite"; chmod +x "$state/old/cnti-testsuite"
          PATH="$state/old:$PATH" run old ANALYZE_PROVIDER=anthropic ANALYZE_API_KEY=$KEY
          grep -q "::warning::AI analysis skipped: this cnti-testsuite has no 'analyze'" "$state/old.log"
          echo "::endgroup::"

          echo "::group::the key stays out of the suite, goes over TLS only, and a failed render is a warning"
          # A wrapper that records the environment the suite gets, and fails
          # render when asked to.
          real=$(command -v cnti-testsuite)
          mkdir -p "$state/wrap"
          printf '#!/bin/sh\nenv > "%s/suite-env.$$"\nif [ -n "$FAIL_RENDER" ] && [ "$1 $2" = "analyze render" ]; then echo "render broke" >&2; exit 1; fi\nexec %s "$@"\n' "$state" "$real" > "$state/wrap/cnti-testsuite"
          chmod +x "$state/wrap/cnti-testsuite"
          reply 200 "$(jq -n --arg t "$answer" '{model: "mock-claude", stop_reason: "end_turn", content: [{type: "text", text: $t}]}')"
          PATH="$state/wrap:$PATH" run wrapped ANALYZE_PROVIDER=anthropic ANALYZE_API_KEY=$KEY
          ls "$state"/suite-env.* > /dev/null
          # KEY is this step's own variable, so every process has it: the key
          # must not be anywhere else in the suite's environment.
          for e in "$state"/suite-env.*; do
            if grep -v '^KEY=' "$e" | grep -q "$KEY"; then echo "::error::the suite was started with the key ($e)"; exit 1; fi
          done
          jq -e '.headers["x-api-key"] == "'"$KEY"'"' "$(last)"
          before=$(requests)
          run plainhttp ANALYZE_PROVIDER=anthropic ANALYZE_API_KEY=$KEY ANALYZE_ENDPOINT=http://cnti.invalid
          test "$(requests)" = "$before"
          grep -q '::warning::AI analysis skipped: analyze_endpoint must use https:// when analyze_api_key is set' "$state/plainhttp.log"
          # A loopback host followed by credentials goes elsewhere: refused too.
          run userinfo ANALYZE_PROVIDER=anthropic ANALYZE_API_KEY=$KEY ANALYZE_ENDPOINT=http://127.0.0.1:8765@cnti.invalid
          test "$(requests)" = "$before"
          grep -q '::warning::AI analysis skipped: analyze_endpoint must use https:// when analyze_api_key is set' "$state/userinfo.log"
          reply 200 "$(jq -n --arg t "$answer" '{model: "mock-claude", stop_reason: "end_turn", content: [{type: "text", text: $t}]}')"
          PATH="$state/wrap:$PATH" run render FAIL_RENDER=1 ANALYZE_PROVIDER=anthropic ANALYZE_API_KEY=$KEY
          grep -q '::warning::AI analysis: cnti-testsuite analyze render failed: .*render broke' "$state/render.log"
          echo "::endgroup::"

  # The analysis against a real model, free: a small one in Ollama on the
  # runner, through openai-compatible, as an adopter whose data must stay in
  # their network would run it. A model this small does not always keep to
  # the schema, so a well-formed analysis and the warning for an answer that is
  # not the expected JSON both pass; an unreachable server or an error does not.
  analyze-local-model:
    name: analyze (local model)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODEL: qwen2.5:1.5b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The current release (`compare` and `analyze` are in v2.4.0 and later).
      - name: The suite (v2.4.1)
        run: |
          mkdir -p "$RUNNER_TEMP/suite"
          curl -sSfL --retry 3 https://github.com/lfn-cnti/testsuite/releases/download/v2.4.1/cnti-testsuite-v2.4.1.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/suite"
      - name: Start Ollama with a small model
        run: |
          set -euo pipefail
          docker run -d --name ollama -p 127.0.0.1:11434:11434 ollama/ollama:0.40.12@sha256:20d1bbfbabe1c97ba4b16301f08a20d8484bcf77047742a3cb71c613d8e12d0b
          for _ in $(seq 60); do curl -sf http://127.0.0.1:11434/api/version && break || sleep 2; done
          docker exec ollama ollama pull "$MODEL"
      - name: Analyze the fixture's failures
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/suite/cnti-testsuite"; export PATH="$RUNNER_TEMP/suite:$PATH"
          start=$(date +%s)
          GITHUB_OUTPUT="$RUNNER_TEMP/out" RESULTS_FILE=.github/fixtures/analyze/run/cnti-testsuite-results-20261031-120000-000.yml \
            ANALYZE_PROVIDER=openai-compatible ANALYZE_ENDPOINT=http://127.0.0.1:11434/v1 ANALYZE_MODEL="$MODEL" ANALYZE_API_KEY= \
            bash scripts/analyze.sh | tee "$RUNNER_TEMP/analyze.log"
          echo "Answered in $(( $(date +%s) - start )) s"
          if [[ -s cnti/analysis.md ]] && grep -q '^### AI analysis (advisory, generated by' cnti/analysis.md; then
            echo "A well-formed analysis"
          elif grep -q "not the expected JSON" "$RUNNER_TEMP/analyze.log"; then
            echo "The model's answer did not keep to the schema: handled as a warning" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::the local model's server did not answer as expected"
            exit 1
          fi
      - name: Ollama's log
        if: failure()
        run: docker logs ollama 2>&1 | tail -50

  # A suite without `cnti-testsuite evidence` (before v2.3.0) and a run that asks
  # for the badge: the action must fail, not skip the badge quietly.
  old-suite-badge:
    name: old suite with badge_branch (fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch example CNF
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lfn-cnti/testsuite
          path: testsuite
          sparse-checkout: example-cnfs/coredns
      - name: Run action
        id: cnti
        continue-on-error: true
        uses: ./
        with:
          version: v2.2.0
          cnf_config: testsuite/example-cnfs/coredns/cnti-testsuite.yaml
          badge_branch: badges-selftest-old-suite
          artifact_name: old-suite-badge
          fail_on_failure: false
      - name: The run must have failed on the missing evidence subcommand
        run: |
          echo "outcome=${{ steps.cnti.outcome }}"
          test "${{ steps.cnti.outcome }}" = "failure"

  # The evidence bundle pushed to a repository: this one, on the evidence-selftest
  # branch, with the job's own token; the same clone, commit and push path as an
  # external evidence repository. Not on pull requests, whose token cannot write.
  evidence:
    name: evidence (coredns)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch example CNF
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lfn-cnti/testsuite
          path: testsuite
          sparse-checkout: example-cnfs/coredns
      - name: Run action
        id: cnti
        uses: ./
        with:
          cnf_config: testsuite/example-cnfs/coredns/cnti-testsuite.yaml
          log_level: info
          fail_on_failure: false
          evidence_repository: ${{ github.repository }}
          evidence_token: ${{ github.token }}
          evidence_branch: evidence-selftest
          attest: "true"
          artifact_name: coredns-evidence-publishing
      - name: Verify the attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify cnti/evidence/cnti-testsuite-results-*.yml --repo "${GITHUB_REPOSITORY}" --predicate-type https://in-toto.io/attestation/test-result/v0.1 --format json \
            | jq -S '.[0].verificationResult.statement.predicate' > signed.json
          jq -e '.predicate.cnti.provenance.method == "github-attestation"' cnti/evidence/cnti-evidence.json
          # The signed predicate is the bundle's: nothing changes the statement after signing.
          jq -S '.predicate' cnti/evidence/cnti-evidence.json | diff - signed.json
      - name: Check the published bundle
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: evidence-selftest
        run: |
          set -euo pipefail
          # No trailing slash for the directory itself: the contents API answers it with 404.
          get() { gh api "repos/$REPO/contents/cnti/coredns${1:+/$1}?ref=$REF" "${@:2}"; }
          for f in latest/cnti-badge.svg latest/cnti-badge.json; do
            get "$f" --jq .name
          done
          run_dir=$(get "" --jq '[.[]|select(.type=="dir" and .name!="latest")|.name]|sort|last')
          for f in cnti-badge.svg cnti-badge.json cnti-evidence.json config/cnti-testsuite.yaml; do
            get "$run_dir/$f" --jq .name
          done
          get "$run_dir/cnti-evidence.json" --jq .content | base64 -d > published.json
          jq -e '.predicate.configuration | length >= 1' published.json
          jq -e '.predicate.cnti.run_url | endswith("/actions/runs/${{ github.run_id }}")' published.json
          # The statement is completed before it is signed or published: the
          # published one is the bundle's, byte for byte.
          cmp published.json cnti/evidence/cnti-evidence.json
